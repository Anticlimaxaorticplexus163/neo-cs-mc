[versions]
minecraft = "1.21.1"
neoforge = "21.1.247"
neoform = "1.21.1-20240808.144430"
moddev = "2.0.143"
kotlin = "2.4.0"
# KFF 5.12.0 ships kotlin-stdlib 2.4.0, kotlinx-coroutines 1.11.0, kotlinx-serialization 1.11.0.
# The kotlinx versions below must track the KFF release so common compiles against what KFF provides at runtime.
kff = "5.12.0"
coroutines = "1.11.0"
serialization = "1.11.0"
mixin = "0.8.7"
mixinextras = "0.4.1"
junit = "5.11.4"

[libraries]
kff-neoforge = { module = "thedarkcolour:kotlinforforge-neoforge", version.ref = "kff" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
mixinextras-common = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
